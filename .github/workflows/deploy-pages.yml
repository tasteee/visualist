name: Deploy to GitHub Pages

# Every merge to main builds the app and publishes it to
# https://tasteee.github.io/visualist/. Docs-only changes skip it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the running deploy
# instead of cancelling it halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project sites are served from /<repo>/. For a custom domain or a user
      # site, set the repository variable PAGES_BASE_PATH to "/".
      VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs the built @tasteee/zest from the zest repo's build branch.
      - run: pnpm install --frozen-lockfile --prefer-offline

      # svelte-check, then a production vite build into dist/.
      - run: pnpm build

      - name: Report bundle sizes
        run: |
          {
            echo "### Bundle (base: $VITE_BASE_PATH)"
            echo
            echo "| File | Size | Gzip |"
            echo "| --- | ---: | ---: |"
            for file in dist/assets/*.js dist/assets/*.css; do
              size=$(stat -c %s "$file")
              gzipped=$(gzip -9 -c "$file" | wc -c)
              echo "| $(basename "$file") | $((size / 1024)) KB | $((gzipped / 1024)) KB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
